spring:
  application:
    name: nepal-hazard-watch
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nepal_hazard_watch}
    username: ${DATABASE_USERNAME:nhw}
    password: ${DATABASE_PASSWORD:nepal123}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    validateOnMigrate: false
    outOfOrder: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

server:
  port: ${PORT:8080}

logging:
  level:
    root: DEBUG
    watch.nepalhazard: DEBUG

weather:
  api-url: https://api.openweathermap.org/data/2.5
  api-key: ${WEATHER_API_KEY:demo-key}
  fetch-interval-ms: 1800000