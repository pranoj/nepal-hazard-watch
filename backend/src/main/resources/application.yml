app:
  # Read by CorsConfig. Set APP_CORS_ORIGIN before going live - comma-separated if more than one origin.
  cors:
    allowed-origins: ${APP_CORS_ORIGIN:http://localhost:5173}

spring:
  application:
    name: nepal-hazard-watch

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nepal_hazard_watch}
    username: ${DATABASE_USERNAME:nhw}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000
      idle-timeout: 300000
      max-lifetime: 1200000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validateOnMigrate: false
    outOfOrder: true

  # dedicated pool - Spring's default @Scheduled executor is a single shared thread, so one stalled job silently freezes every other scheduled job
  task:
    scheduling:
      pool:
        size: 4

server:
  port: ${PORT:8080}
  servlet:
    context-path: /api
  compression:
    enabled: true
    min-response-size: 1024

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      simple:
        enabled: true

logging:
  level:
    root: INFO
    watch.nepalhazard: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/nepal-hazard-watch.log
    max-size: 10MB
    max-history: 10

earthquake:
  usgs:
    # pre-built summary feed (USGS-recommended for polling), not the fdsnws query API; "2.5" is the closest bucket below our 4.0 floor, filtered client-side in UsgsEarthquakeService
    api-url: https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_day.geojson
    # matches USGS's 60s server-side cache window; a new detection also triggers an immediate rescan rather than waiting for the 30-min cycle
    fetch-interval-ms: 60000
    min-magnitude: 4.0
    timeout-seconds: 30
    retry-attempts: 3

  # widened north of Nepal's actual border to catch seismic activity in Tibet/China - the Aug 2026 Kyirong-Rasuwa GLOF originated from that side
  nepal:
    latitude-min: 26.0
    latitude-max: 31.5
    longitude-min: 80.0
    longitude-max: 88.5

  glacier-zone:
    latitude-min: 28.0
    latitude-max: 29.5

  alert:
    critical-magnitude: 6.0
    high-magnitude: 5.5
    moderate-magnitude: 5.0
    low-magnitude: 4.0

weather:
  api-url: ${WEATHER_API_URL:https://api.openweathermap.org/data/2.5}
  api-key: ${WEATHER_API_KEY:your-api-key-here}
  fetch-interval-ms: 1800000
  timeout-seconds: 15

glof:
  risk-scan-interval-ms: 1800000

terrain:
  elevation:
    api-url: ${ELEVATION_API_URL:https://api.open-elevation.com/api/v1/lookup}
    timeout-seconds: 15

# real credentials belong only in application-local.yml (gitignored), never here
satellite:
  sentinel-hub:
    client-id: ${SENTINEL_HUB_CLIENT_ID:}
    client-secret: ${SENTINEL_HUB_CLIENT_SECRET:}
    token-url: https://identity.dataspace.copernicus.eu/auth/realms/CDSE/protocol/openid-connect/token
    statistics-url: https://sh.dataspace.copernicus.eu/statistics/v1
    timeout-seconds: 20
  # 5 days, matching Sentinel-2's revisit cadence - the service also skips readings fresher than 4 days so restarts don't re-burn quota
  tracking-interval-ms: 432000000
  factor:
    # kill switch for the satellite lake-growth contribution; calibrated against real HKH data, MVP pending a full live season
    enabled: true
  # separate kill switch (glacier ice-drop) - unlike satellite.factor above, NOT backed by a published calibration dataset, first-pass defaults only
  glacier-factor:
    enabled: true