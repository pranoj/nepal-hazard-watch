spring:
  application:
    name: nepal-hazard-watch
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/nepal_hazard_watch}
    username: ${DATABASE_USERNAME:nhw}
    password: ${DATABASE_PASSWORD:nepal123}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

server:
  port: ${PORT:8080}
